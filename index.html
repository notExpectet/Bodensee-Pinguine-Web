<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodensee Pinguine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 80px;
    }
    .text {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      line-height: 1.7;
      color: #111;
    }
    svg {
      width: 160px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">
      Wartungsarbeiten /<br>
      Maintenance work
    </div>
    <!-- Tux-style penguin with sunglasses -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" aria-label="Penguin">
      <!-- Body -->
      <ellipse cx="100" cy="165" rx="62" ry="75" fill="#111" stroke="#111" stroke-width="2"/>
      <!-- White belly -->
      <ellipse cx="100" cy="175" rx="38" ry="56" fill="#f5f5f5"/>
      <!-- Head -->
      <ellipse cx="100" cy="75" rx="48" ry="46" fill="#111" stroke="#111" stroke-width="2"/>
      <!-- White face -->
      <ellipse cx="100" cy="82" rx="30" ry="28" fill="#f5f5f5"/>
      <!-- Beak -->
      <polygon points="100,97 88,112 112,112" fill="#e85d00"/>
      <!-- Left wing -->
      <ellipse cx="34" cy="170" rx="18" ry="45" fill="#111" transform="rotate(-10 34 170)"/>
      <!-- Right wing -->
      <ellipse cx="166" cy="170" rx="18" ry="45" fill="#111" transform="rotate(10 166 170)"/>
      <!-- Left foot -->
      <ellipse cx="78" cy="236" rx="22" ry="10" fill="#e85d00" transform="rotate(-10 78 236)"/>
      <!-- Right foot -->
      <ellipse cx="122" cy="236" rx="22" ry="10" fill="#e85d00" transform="rotate(10 122 236)"/>
      <!-- Sunglasses bridge -->
      <rect x="86" y="68" width="28" height="3" rx="1.5" fill="#111"/>
      <!-- Left lens -->
      <rect x="56" y="60" width="30" height="20" rx="5" fill="#111"/>
      <!-- Left lens shine -->
      <rect x="60" y="64" width="8" height="5" rx="2" fill="#555"/>
      <!-- Right lens -->
      <rect x="114" y="60" width="30" height="20" rx="5" fill="#111"/>
      <!-- Right lens shine -->
      <rect x="118" y="64" width="8" height="5" rx="2" fill="#555"/>
      <!-- Left temple -->
      <line x1="56" y1="68" x2="44" y2="64" stroke="#111" stroke-width="3" stroke-linecap="round"/>
      <!-- Right temple -->
      <line x1="144" y1="68" x2="156" y2="64" stroke="#111" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
</body>
</html>
