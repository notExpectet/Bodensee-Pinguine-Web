<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bodensee Pinguine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      display: flex;
      align-items: center;
      gap: 80px;
    }
    .text {
      font-family: 'Space Mono', 'Courier New', Courier, monospace;
      font-weight: 700;
      font-size: 1.25rem;
      line-height: 1.7;
      color: #111;
    }
    .penguin {
      width: 160px;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text">
      Wartungsarbeiten /<br>
      Maintenance work
    </div>
    <img src="ppp.svg" alt="Pinguin" class="penguin">
  </div>
</body>
</html>
